name: rubric-rag

services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rubric_chunks}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfs-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-rubric-documents}
      S3_PRESIGNED_URL_EXPIRY_SECONDS: ${S3_PRESIGNED_URL_EXPIRY_SECONDS:-900}
      # Direct HTTP endpoint of the embedding model container. That container must
      # share this Docker network (normally with the DNS name "embeddings").
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embeddings:8000/v1/embeddings}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDINGS_DIMENSION: ${EMBEDDINGS_DIMENSION:-384}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_TIMEOUT_SECONDS: ${EMBEDDINGS_TIMEOUT_SECONDS:-30}
      EMBEDDINGS_BATCH_SIZE: ${EMBEDDINGS_BATCH_SIZE:-64}
      EMBEDDINGS_MAX_RETRIES: ${EMBEDDINGS_MAX_RETRIES:-2}
      PROCESSING_DIR: /tmp/rubric-rag
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-seaweedfs-secret}
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:
  seaweedfs_data:
